<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Mahjong Hands - Validate and visualize Mahjong and Riichi tile combinations" />
  <link rel="canonical" href="https://mahjong.sagelga.com/" />
  <link rel="icon" type="image/png" href="/mahjonghands.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Mahjong Hands</title>

  <!-- Keep the first paint in the chosen theme, before React mounts. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        } else if (stored === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) { /* private mode: keep the dark default */ }
    })();
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mahjong.sagelga.com/" />
  <meta property="og:title" content="Mahjong Hands" />
  <meta property="og:description"
    content="Mahjong Hands - Validate and visualize Mahjong and Riichi tile combinations" />
  <meta property="og:image" content="https://mahjong.sagelga.com/mahjonghands.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://mahjong.sagelga.com/" />
  <meta property="twitter:title" content="Mahjong Hands" />
  <meta property="twitter:description"
    content="Mahjong Hands - Validate and visualize Mahjong and Riichi tile combinations" />
  <meta property="twitter:image" content="https://mahjong.sagelga.com/mahjonghands.png" />

  <link rel="preload" href="/fonts/Inter_18pt-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Inter_18pt-Bold.woff2" as="font" type="font/woff2" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
